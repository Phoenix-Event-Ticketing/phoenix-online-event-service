name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  osv-scanner:
    name: OSV dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: "2.3.3"
        run: |
          curl -sSfL -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run OSV Scanner
        id: osv_scan
        continue-on-error: true
        run: osv-scanner scan -r . --format sarif --output osv.sarif

      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      - name: Fail if OSV found vulnerabilities
        if: steps.osv_scan.outcome == 'failure'
        run: |
          echo "OSV Scanner reported vulnerabilities."
          exit 1

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t phoenix-online-event-service:ci .

      - name: Run Trivy image scan
        id: trivy_image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: phoenix-online-event-service:ci
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage for Sonar
        run: npm run test:coverage

      - name: Set Sonar Quality Gate mode
        id: sonar_qg
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "wait=true" >> "$GITHUB_OUTPUT"
          else
            echo "wait=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Cloud Analysis (+ QG on main)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=${{ steps.sonar_qg.outputs.wait }}
            -Dsonar.qualitygate.timeout=300

  push-image:
    name: Push Docker image to Artifact Registry
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [osv-scanner, trivy-image, sonar]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      GCP_IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP Artifact Registry configuration
        run: |
          set -euo pipefail
          missing=()
          trim() { printf '%s' "${1:-}" | tr -d '\r\n'; }
          [ -z "$(trim "${GCP_PROJECT_ID:-}")" ] && missing+=("GCP_PROJECT_ID")
          [ -z "$(trim "${GCP_REGION:-}")" ] && missing+=("GCP_REGION")
          [ -z "$(trim "${GCP_ARTIFACT_REGISTRY:-}")" ] && missing+=("GCP_ARTIFACT_REGISTRY")
          [ -z "$(trim "${GCP_IMAGE_NAME:-}")" ] && missing+=("GCP_IMAGE_NAME")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing or empty GitHub Actions repository variables: ${missing[*]}"
            echo "Add them under: Settings > Secrets and variables > Actions > Variables"
            echo "Required: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REGISTRY, GCP_IMAGE_NAME"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          GCP_REGION="$(printf '%s' "$GCP_REGION" | tr -d '\r\n')"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          set -euo pipefail
          GCP_REGION="$(printf '%s' "$GCP_REGION" | tr -d '\r\n')"
          GCP_PROJECT_ID="$(printf '%s' "$GCP_PROJECT_ID" | tr -d '\r\n')"
          GCP_ARTIFACT_REGISTRY="$(printf '%s' "$GCP_ARTIFACT_REGISTRY" | tr -d '\r\n')"
          GCP_IMAGE_NAME="$(printf '%s' "$GCP_IMAGE_NAME" | tr -d '\r\n')"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY}/${GCP_IMAGE_NAME}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:dev-latest"
            docker push "${IMAGE}:dev-latest"
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:main-latest"
            docker push "${IMAGE}:main-latest"
          fi

  gitops-update:
    name: Update GitOps config (event-service image)
    runs-on: ubuntu-latest
    needs: push-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      GCP_IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
      GITOPS_KUSTOMIZE_IMAGE_NAME: ${{ vars.GITOPS_KUSTOMIZE_IMAGE_NAME }}

    steps:
      - name: Install kustomize and yq
        env:
          KUSTOMIZE_VERSION: "5.5.0"
          YQ_VERSION: "v4.44.3"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xzC /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          kustomize version
          yq --version

      - name: Checkout platform config
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_REPO_PAT }}
          ref: main
          path: gitops-repo

      - name: Bump event-service image in Kustomize overlay
        run: |
          set -euo pipefail
          GCP_REGION="$(printf '%s' "$GCP_REGION" | tr -d '\r\n')"
          GCP_PROJECT_ID="$(printf '%s' "$GCP_PROJECT_ID" | tr -d '\r\n')"
          GCP_ARTIFACT_REGISTRY="$(printf '%s' "$GCP_ARTIFACT_REGISTRY" | tr -d '\r\n')"
          GCP_IMAGE_NAME="$(printf '%s' "$GCP_IMAGE_NAME" | tr -d '\r\n')"
          GITOPS_KUSTOMIZE_IMAGE_NAME="$(printf '%s' "${GITOPS_KUSTOMIZE_IMAGE_NAME:-}" | tr -d '\r\n')"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY}/${GCP_IMAGE_NAME}"
          KUSTOMIZE_IMAGE_NAME="${GITOPS_KUSTOMIZE_IMAGE_NAME:-${IMAGE}}"
          case "${GITHUB_REF_NAME}" in
            dev) OVERLAY_ENV=dev ;;
            main) OVERLAY_ENV=prod ;;
            *) echo "Unexpected ref: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          OVERLAY_DIR="gitops-repo/<actual-path>/${OVERLAY_ENV}"
          cd "${OVERLAY_DIR}"
          export TAG="${GITHUB_SHA}"
          export IMG_NAME="${KUSTOMIZE_IMAGE_NAME}"
          yq e -i '(.images[] | select(.name == strenv(IMG_NAME))).newTag = strenv(TAG)' kustomization.yaml
          sed -i '/^    newName:/d' kustomization.yaml
          kustomize build . >/dev/null

      - name: Commit and push
        run: |
          set -euo pipefail
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u apps/event-service/overlays/
          if git diff --cached --quiet; then
            echo "No kustomization changes to commit."
            exit 0
          fi
          git commit -m "chore(event-service): bump image tag to ${GITHUB_SHA:0:7}"
          git push origin HEAD:main
